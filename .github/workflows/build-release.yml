name: Build and publish BRAT release

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - .github/workflows/build-release.yml
  workflow_dispatch:

# Only one publishing job may change the release assets at a time.
concurrency:
  group: eome-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Compile and verify plugin
        run: npm run build
      - name: Verify BRAT assets and version alignment
        shell: bash
        run: |
          set -euo pipefail
          test -s main.js
          test -s manifest.json
          test -s styles.css
          node - <<'NODE'
          const manifest = require('./manifest.json');
          const pkg = require('./package.json');
          if (manifest.version !== pkg.version) {
            throw new Error('Release version mismatch: manifest ' + manifest.version + ' vs package ' + pkg.version);
          }
          NODE
      - name: Publish or verify existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Verifying BRAT assets."
            ASSETS="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
            for FILE in main.js manifest.json styles.css; do
              if ! grep -Fxq "$FILE" <<<"$ASSETS"; then
                echo "Adding missing release asset: $FILE"
                gh release upload "$VERSION" "$FILE"
              fi
            done
          else
            gh release create "$VERSION" main.js manifest.json styles.css \
              --title "EOME Inline Handwriting $VERSION" \
              --notes "Release for BRAT. Back up your vault and verify Pencil/BOOX behavior on a test map." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          ASSETS="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
          for FILE in main.js manifest.json styles.css; do
            grep -Fxq "$FILE" <<<"$ASSETS" || {
              echo "::error::Release $VERSION is missing $FILE"
              exit 1
            }
          done
          echo "EOME $VERSION: release and all three BRAT assets verified."
