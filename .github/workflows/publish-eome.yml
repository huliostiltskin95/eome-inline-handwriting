name: Publish EOME Obsidian release
on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/publish-eome.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish tagged BRAT assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          TAG="$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" \
            --title "EOME Inline Handwriting $VERSION" \
            --notes "Experimental: isolated inline map rendering, semantic layout refinements and per-node pen undo/redo. Back up your vault and test on a sample map before using on live notes."
